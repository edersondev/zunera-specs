openapi: 3.1.0
info:
  title: Zunera Credit Cards API
  version: 1.0.0
  license: { name: Proprietary, identifier: LicenseRef-Proprietary }
  description: >-
    Owner-scoped personal credit-card management. Card purchases create
    obligations; statement payments settle them from financial accounts and are
    never categorized expenses. All financial mutations require Idempotency-Key.
servers: [{ url: /api/v1 }]
paths:
  /credit-cards:
    get:
      summary: List owned active or archived credit cards
      operationId: listCreditCards
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CardView' }]
      responses:
        '200': { description: Owned cards with derived summary, content: { application/json: { schema: { $ref: '#/components/schemas/CardCollectionResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      summary: Create owned active credit card
      operationId: createCreditCard
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateCardRequest' } } } }
      responses:
        '201': { description: Created card, content: { application/json: { schema: { $ref: '#/components/schemas/CardResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /credit-cards/{card_id}:
    get:
      summary: Read owned card with derived current statement summary
      operationId: getCreditCard
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CardId' }]
      responses:
        '200': { description: Owned card, content: { application/json: { schema: { $ref: '#/components/schemas/CardResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Update owned active card descriptive and billing data
      operationId: updateCreditCard
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CardId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateCardRequest' } } } }
      responses:
        '200': { description: Updated card, content: { application/json: { schema: { $ref: '#/components/schemas/CardResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /credit-cards/{card_id}/archive:
    post:
      summary: Archive owned card with zero outstanding obligation
      operationId: archiveCreditCard
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CardId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Archived card, content: { application/json: { schema: { $ref: '#/components/schemas/CardResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /credit-cards/{card_id}/purchases:
    get:
      summary: List owned card purchases newest first
      operationId: listCreditCardPurchases
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CardId' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PerPage' }]
      responses:
        '200': { description: Paginated purchases, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseCollectionResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: Record purchase and allocate installments to card statements
      operationId: createCreditCardPurchase
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CardId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePurchaseRequest' } } } }
      responses:
        '201': { description: Created purchase, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /credit-card-purchases/{purchase_id}:
    get:
      summary: Read owned purchase, installments, and credit-event history
      operationId: getCreditCardPurchase
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PurchaseId' }]
      responses:
        '200': { description: Owned purchase, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Directly correct purchase only while every statement remains Open
      operationId: updateOpenCreditCardPurchase
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PurchaseId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePurchaseRequest' } } } }
      responses:
        '200': { description: Corrected purchase, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /credit-card-purchases/{purchase_id}/credit-events:
    post:
      summary: Record traceable cancellation refund or post-closing correction
      operationId: createCreditCardCreditEvent
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PurchaseId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateCreditEventRequest' } } } }
      responses:
        '201': { description: Credit event and affected card projections, content: { application/json: { schema: { $ref: '#/components/schemas/CreditEventResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /credit-cards/{card_id}/statements:
    get:
      summary: List owned card statements including derived current zero statement
      operationId: listCreditCardStatements
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CardId' }, { $ref: '#/components/parameters/StatementStatus' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PerPage' }]
      responses:
        '200': { description: Paginated statement summaries, content: { application/json: { schema: { $ref: '#/components/schemas/StatementCollectionResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /credit-card-statements/{statement_id}:
    get:
      summary: Read owned statement lines payments and credit applications
      operationId: getCreditCardStatement
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/StatementId' }]
      responses:
        '200': { description: Statement detail, content: { application/json: { schema: { $ref: '#/components/schemas/StatementResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /credit-card-statements/{statement_id}/payments:
    post:
      summary: Create pending or effective statement settlement from owned account
      operationId: createCreditCardStatementPayment
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/StatementId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePaymentRequest' } } } }
      responses:
        '201': { description: Created payment and statement, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /credit-card-payments/{payment_id}:
    get:
      summary: Read owned statement payment
      operationId: getCreditCardStatementPayment
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PaymentId' }]
      responses:
        '200': { description: Payment detail, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Correct active owned statement payment
      operationId: updateCreditCardStatementPayment
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PaymentId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePaymentRequest' } } } }
      responses:
        '200': { description: Updated payment and statement, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /credit-card-payments/{payment_id}/remove:
    post:
      summary: Recoverably remove owned payment and reverse effective account/card effects
      operationId: removeCreditCardStatementPayment
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PaymentId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Removed payment, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /credit-card-payments/{payment_id}/restore:
    post:
      summary: Restore removed payment under current statement/account rules
      operationId: restoreCreditCardStatementPayment
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PaymentId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/RestorePaymentRequest' } } } }
      responses:
        '200': { description: Restored payment, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /financial-dashboard/credit-cards:
    get:
      summary: Read separate owned card obligations and upcoming statement dues
      operationId: getFinancialDashboardCreditCards
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Additive card dashboard projection, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardCreditCardsResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /financial-history:
    get:
      summary: Extend mixed history with recognized card-installment expense entries
      operationId: listFinancialHistoryWithCreditCards
      security: [{ cookieAuth: [] }]
      parameters:
        - name: movement_kind
          in: query
          schema: { type: string, enum: [all, income, expense, transfer, credit_card_expense], default: all }
        - name: credit_card_id
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: Existing history response adds discriminated `credit_card_expense`; statement payments never appear as expense entries. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: zunera_session }
  parameters:
    CardId: { name: card_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    PurchaseId: { name: purchase_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    StatementId: { name: statement_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    PaymentId: { name: payment_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
    CardView: { name: view, in: query, schema: { type: string, enum: [active, archived], default: active } }
    StatementStatus: { name: status, in: query, schema: { type: string, enum: [open, closed, partially_paid, paid, overdue] } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PerPage: { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 50 } }
  schemas:
    Money:
      type: object
      required: [amount_centavos, currency_code]
      properties:
        amount_centavos: { type: integer }
        currency_code: { type: string, const: BRL }
    CardIdentity:
      type: object
      required: [id, name, institution_name, status]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }
        institution_name: { type: string }
        last_four: { type: [string, 'null'], pattern: '^[0-9]{4}$' }
        color: { type: [string, 'null'] }
        icon: { type: [string, 'null'] }
        status: { type: string, enum: [active, archived] }
    CardSummary:
      type: object
      required: [credit_limit, used_credit, card_credit, available_credit, is_over_limit]
      properties:
        credit_limit: { $ref: '#/components/schemas/Money' }
        used_credit: { $ref: '#/components/schemas/Money' }
        card_credit: { $ref: '#/components/schemas/Money' }
        available_credit: { $ref: '#/components/schemas/Money' }
        is_over_limit: { type: boolean }
    StatementSummary:
      type: object
      required: [id, card, period_from, period_to, closing_date, due_date, original_amount, credit_adjustments, net_amount, paid_amount, card_credit_applied, outstanding_amount, status, is_current]
      properties:
        id: { type: [integer, 'null'], minimum: 1, description: Null only for synthesized no-activity current statement. }
        card: { $ref: '#/components/schemas/CardIdentity' }
        period_from: { type: string, format: date }
        period_to: { type: string, format: date }
        closing_date: { type: string, format: date }
        due_date: { type: string, format: date }
        original_amount: { $ref: '#/components/schemas/Money' }
        credit_adjustments: { $ref: '#/components/schemas/Money' }
        net_amount: { $ref: '#/components/schemas/Money' }
        paid_amount: { $ref: '#/components/schemas/Money' }
        card_credit_applied: { $ref: '#/components/schemas/Money' }
        outstanding_amount: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [open, closed, partially_paid, paid, overdue] }
        is_current: { type: boolean }
    Card:
      allOf:
        - $ref: '#/components/schemas/CardIdentity'
        - type: object
          required: [closing_day, due_day, summary, current_statement]
          properties:
            closing_day: { type: integer, minimum: 1, maximum: 31 }
            due_day: { type: integer, minimum: 1, maximum: 31 }
            summary: { $ref: '#/components/schemas/CardSummary' }
            current_statement: { $ref: '#/components/schemas/StatementSummary' }
    CategorySummary:
      type: object
      required: [id, name, classification, status]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }
        classification: { type: string, const: expense }
        status: { type: string, enum: [active, archived] }
    Installment:
      type: object
      required: [id, sequence, total_count, amount, recognition_date, recognition_status, statement]
      properties:
        id: { type: integer, minimum: 1 }
        sequence: { type: integer, minimum: 1 }
        total_count: { type: integer, minimum: 1 }
        amount: { $ref: '#/components/schemas/Money' }
        credit_adjustment: { $ref: '#/components/schemas/Money' }
        recognized_amount: { $ref: '#/components/schemas/Money' }
        recognition_date: { type: string, format: date, description: Statement closing date. }
        recognition_status: { type: string, enum: [pending, effective] }
        statement: { $ref: '#/components/schemas/StatementSummary' }
    Purchase:
      type: object
      required: [id, card, category, description, purchase_date, total_amount, installment_count, installments, is_directly_editable]
      properties:
        id: { type: integer, minimum: 1 }
        card: { $ref: '#/components/schemas/CardIdentity' }
        category: { $ref: '#/components/schemas/CategorySummary' }
        description: { type: string }
        notes: { type: [string, 'null'] }
        purchase_date: { type: string, format: date }
        total_amount: { $ref: '#/components/schemas/Money' }
        installment_count: { type: integer, minimum: 1, maximum: 360 }
        installments: { type: array, items: { $ref: '#/components/schemas/Installment' } }
        credit_events: { type: array, items: { $ref: '#/components/schemas/CreditEvent' } }
        is_directly_editable: { type: boolean }
    CreditEvent:
      type: object
      required: [id, reason, amount, event_date, applications]
      properties:
        id: { type: integer, minimum: 1 }
        reason: { type: string, enum: [cancellation, refund, correction] }
        amount: { $ref: '#/components/schemas/Money' }
        event_date: { type: string, format: date }
        notes: { type: [string, 'null'] }
        applications:
          type: array
          items:
            type: object
            required: [installment_id, statement_id, amount]
            properties:
              installment_id: { type: integer }
              statement_id: { type: [integer, 'null'] }
              amount: { $ref: '#/components/schemas/Money' }
    AccountSummary:
      type: object
      required: [id, name, status]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }
        status: { type: string, enum: [active, archived] }
    Payment:
      type: object
      required: [id, statement_id, financial_account, amount, payment_date, status, is_removed]
      properties:
        id: { type: integer, minimum: 1 }
        statement_id: { type: integer, minimum: 1 }
        financial_account: { $ref: '#/components/schemas/AccountSummary' }
        amount: { $ref: '#/components/schemas/Money' }
        payment_date: { type: string, format: date }
        notes: { type: [string, 'null'] }
        status: { type: string, enum: [pending, effective] }
        is_removed: { type: boolean }
    Statement:
      allOf:
        - $ref: '#/components/schemas/StatementSummary'
        - type: object
          required: [installments, payments, credit_events]
          properties:
            installments: { type: array, items: { $ref: '#/components/schemas/Installment' } }
            payments: { type: array, items: { $ref: '#/components/schemas/Payment' } }
            credit_events: { type: array, items: { $ref: '#/components/schemas/CreditEvent' } }
    CreateCardRequest:
      type: object
      required: [name, institution_name, credit_limit_centavos, closing_day, due_day]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        institution_name: { type: string, minLength: 1, maxLength: 100 }
        last_four: { type: [string, 'null'], pattern: '^[0-9]{4}$' }
        credit_limit_centavos: { type: integer, minimum: 1, maximum: 99999999999 }
        closing_day: { type: integer, minimum: 1, maximum: 31 }
        due_day: { type: integer, minimum: 1, maximum: 31 }
        color: { type: [string, 'null'] }
        icon: { type: [string, 'null'] }
    UpdateCardRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        institution_name: { type: string, minLength: 1, maxLength: 100 }
        last_four: { type: [string, 'null'], pattern: '^[0-9]{4}$' }
        credit_limit_centavos: { type: integer, minimum: 1, maximum: 99999999999 }
        closing_day: { type: integer, minimum: 1, maximum: 31 }
        due_day: { type: integer, minimum: 1, maximum: 31 }
        color: { type: [string, 'null'] }
        icon: { type: [string, 'null'] }
    CreatePurchaseRequest:
      type: object
      required: [category_id, description, purchase_date, total_amount_centavos, installment_count, confirm_over_limit]
      properties:
        category_id: { type: integer, minimum: 1 }
        description: { type: string, minLength: 1, maxLength: 200 }
        notes: { type: [string, 'null'], maxLength: 1000 }
        purchase_date: { type: string, format: date }
        total_amount_centavos: { type: integer, minimum: 1, maximum: 99999999999 }
        installment_count: { type: integer, minimum: 1, maximum: 360 }
        confirm_over_limit: { type: boolean, default: false }
    UpdatePurchaseRequest:
      allOf:
        - $ref: '#/components/schemas/CreatePurchaseRequest'
        - type: object
          minProperties: 1
    CreateCreditEventRequest:
      type: object
      required: [reason, amount_centavos, event_date]
      properties:
        reason: { type: string, enum: [cancellation, refund, correction] }
        amount_centavos: { type: integer, minimum: 1, maximum: 99999999999 }
        event_date: { type: string, format: date }
        notes: { type: [string, 'null'], maxLength: 1000 }
    CreatePaymentRequest:
      type: object
      required: [financial_account_id, amount_centavos, payment_date]
      properties:
        financial_account_id: { type: integer, minimum: 1 }
        amount_centavos: { type: integer, minimum: 1, maximum: 99999999999 }
        payment_date: { type: string, format: date }
        status: { type: string, enum: [pending, effective], description: Future date defaults pending. }
        notes: { type: [string, 'null'], maxLength: 1000 }
    UpdatePaymentRequest:
      type: object
      minProperties: 1
      properties:
        financial_account_id: { type: integer, minimum: 1 }
        amount_centavos: { type: integer, minimum: 1, maximum: 99999999999 }
        payment_date: { type: string, format: date }
        status: { type: string, enum: [pending, effective] }
        notes: { type: [string, 'null'], maxLength: 1000 }
    RestorePaymentRequest:
      type: object
      properties: { status: { type: string, enum: [pending, effective] } }
    CardResponse: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Card' } } }
    CardCollectionResponse: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/Card' } } } }
    PurchaseResponse: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Purchase' } } }
    PurchaseCollectionResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Purchase' } }
        meta: { $ref: '#/components/schemas/Pagination' }
    CreditEventResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [credit_event, card, affected_statements]
          properties:
            credit_event: { $ref: '#/components/schemas/CreditEvent' }
            card: { $ref: '#/components/schemas/Card' }
            affected_statements: { type: array, items: { $ref: '#/components/schemas/StatementSummary' } }
    StatementResponse: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Statement' } } }
    StatementCollectionResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/StatementSummary' } }
        meta: { $ref: '#/components/schemas/Pagination' }
    PaymentResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [payment, statement, card]
          properties:
            payment: { $ref: '#/components/schemas/Payment' }
            statement: { $ref: '#/components/schemas/StatementSummary' }
            card: { $ref: '#/components/schemas/Card' }
    DashboardCreditCardsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [outstanding_obligation, card_credit, available_credit, cards, upcoming_statements]
          properties:
            outstanding_obligation: { $ref: '#/components/schemas/Money' }
            card_credit: { $ref: '#/components/schemas/Money' }
            available_credit: { $ref: '#/components/schemas/Money' }
            cards: { type: array, items: { $ref: '#/components/schemas/Card' } }
            upcoming_statements: { type: array, items: { $ref: '#/components/schemas/StatementSummary' } }
    Pagination:
      type: object
      required: [current_page, last_page, per_page, total]
      properties:
        current_page: { type: integer, minimum: 1 }
        last_page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1, maximum: 50 }
        total: { type: integer, minimum: 0 }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        code: { type: string }
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
  responses:
    Error:
      description: Authentication, ownership, validation, current-state, idempotency, or concurrency error without foreign-data disclosure.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
