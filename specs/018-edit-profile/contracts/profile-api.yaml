openapi: 3.1.0
info:
  title: Zunera Profile API
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - cookieAuth: []
paths:
  /auth/profile:
    patch:
      summary: Update current user's name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 255 }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { description: Not authenticated or session expired }
        '422': { description: Invalid name or unsupported field }
  /auth/password:
    patch:
      summary: Change current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string, minLength: 8, maxLength: 64 }
                password_confirmation: { type: string }
      responses:
        '204': { description: Password changed; current session remains active }
        '401': { description: Not authenticated or session expired }
        '422': { description: Invalid current or new password }
        '429': { description: Too many failed current-password attempts in 15 minutes }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: zunera_session }
  schemas:
    User:
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
